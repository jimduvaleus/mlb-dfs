# Snapshot of known-good config.yaml values (config.yaml itself is
# gitignored — per-machine). Copy to config.yaml to bootstrap a setup.
# Refresh periodically when the live values are worth preserving:
#   cp config.yaml config.example.yaml   (keep this header)
# gpp.dupe_* coefficients are fitted by scripts/fit_dupe_model.py — this
# snapshot's values were fitted 2026-07-10 on 37 archived contests.
# Snapshot taken: 2026-07-10
platform: draftkings
paths:
  dk_slate: data/raw/DKSalaries.csv
  fd_slate: data/raw/FanDuel-MLB-2026-04-18-129137-entries-upload-template.csv
  copula: data/processed/empirical_copula.parquet
  output_dir: outputs
  projections: data/processed/projections.csv
  fd_projections: ''
  batter_pca_model: data/processed/batter_pca_model.npz
  batter_score_grid: data/processed/batter_score_grid.npy
  batter_pca_model_fd: ''
  batter_score_grid_fd: ''
  projections_source: market_odds
simulation:
  n_sims: 25000
optimizer:
  n_chains: 200
  temperature: 0.05
  n_steps: 100
  niter_success: 30
  n_workers: 8
  early_stopping_window: 15
  early_stopping_threshold: 0.0005
  salary_floor: 48500.0
  rng_seed: null
  min_pitcher_value: null
  min_batter_value: null
portfolio:
  size: 10
  target_percentile: 99
  target_score: null
gpp:
  n_candidates: 20000
  n_field_lineups: 5000
  n_field_samples: 2
  holdout_fraction: 0.0
  candidate_batch_size: 500
  max_attempts_multiplier: 55
  seed_optimal_lineups: false
  seed_sim_optimal_lineups: false
  n_sim_optimals: 1000
  sim_optimal_min_stack: 4
  sim_optimal_min_secondary: 0
  sim_optimal_salary_floor: null
  seed_sim_winners: false
  n_sim_winner_worlds: 8000
  sim_winner_per_world: 1
  sim_winner_temp: 0.15
  sim_winner_own_blend: 0.25
  # Shape-preserving seed mutation: N mutants per seed parent, exact
  # team-stack profile preserved (additive on top of n_candidates). 0 = off.
  seed_mutants_per_parent: 0
  seed_mutant_salary_locality: 2000.0
  seed_mutant_pitcher_weight: 0.10
  dump_candidate_pool: true
  measure_sim_ceiling: 200
  candidate_floor_relief: 3000
  refine_rounds: 4
  refine_top: 250
  refine_mutants: 8
  refine_holdout_fraction: 0.3
  final_n_field_samples: 3
  tail_bypass_n: 0
  tail_bypass_ev_floor: -1.0
  compute_tail_metrics: true
  tail_ev_min_gross: 100.0
  funnel_mode: ev_first
  tail_metric: tail_ev
  tail_admit_n: 6000
  ev_guardrail: -1.0
  selector_score: mean_ev
  cash_anchor_fraction: 0.25
  # Round-10 selector objective: det (default) | kelly | coverage
  # Comma list of selection arms, or 'all'. Determinant is the usual omission:
  # most expensive (only arm needing the M x M correlation matrix) and 9-13
  # points of portfolio ROI behind Kelly/dR/coverage across four contests.
  # Kelly and E[max] add nothing upstream; coverage adds ~69 MB of packed world
  # bits during the fresh re-score; dR retains the sorted field (~0.6-1.2 GB).
  selector_mode: kelly,dr
  # Contest identity for the GPP objectives. Empty = the legacy fixed
  # dk_classic_gpp_5001 reference curve. A DK contest name (e.g. "Bat Flip") or
  # a registered structure resolves the REAL ladder and field size, which is
  # what makes the objectives contest-aware.
  contest_structure: ''
  contest_field_size: 0      # 0 = take it from the resolved structure
  dr_shortlist: 4000         # memory cap on the dR arm; see pipeline.py
  kelly_bankroll_mult: 1.0
  # Per-contest selection. Active whenever the slate has *Entries.csv files:
  # each contest picks its own slice against its own ladder, in descending
  # top-prize order. contest_structure above still sets the reference ladder
  # the funnel is denominated in, and is the whole story with no entry files.
  per_contest_shortlist: 8000       # candidates handed to the per-contest arms;
                                    # size against imported pool + frontier_target_lineups,
                                    # not the import alone. ~4.3GB peak, ~7min at n_sims=25k
  per_contest_field_samples: 1      # field draws per contest; costs a score+sort each
  per_contest_disjoint: true        # no lineup entered in two contests
  per_contest_rank_sims: 2500       # worlds used to rank the pool per contest for the shortlist
                                    # union; 0 = fall back to the ownership-stratified cut
  per_contest_cand_per_entry: 400   # per-contest candidate cap, PER PURCHASED ENTRY
                                    # (floor 2,000). Stops a 2-entry contest paying for
                                    # an 8k-candidate dR state; no-op above ~20 entries.
                                    # 0 disables. Changes picks, not just speed.
                                    # Auto-forced to 0 unless dR or Determinant is
                                    # selected — no other arm's cost grows faster
                                    # than linearly in M, so the cap is pure loss.
  per_contest_shortlist_strata: 10  # fallback only: ownership bands; 1 = plain top-N by EV
  per_contest_cand_chunk: 2000      # payout-kernel chunk (memory only)
  final_rescore_top: 20000
  evw_base: 0.10
  evw_max: 0.30
  ev_floor: 0.25
  field_source: simulated
  historical_n_slates: 10
  dupe_penalty: true
  dupe_intercept: 3.573
  dupe_log_own_coef: 0.223
  dupe_salary_coef: 0.095
  dupe_stack_coef: -0.102
  dupe_min_gross_payout: 15.0
  external_pool_ev_type: roi        # roi | prj_own | p_win | proj_top | self_play | topn_coverage | marginal_reward | per_contest
                                   # per_contest = run the imported pool through the same per-contest
                                   # selection the generated path uses, with gpp.selector_mode's arms
                                   # (kelly/dr/emax/coverage). Differs from marginal_reward in SHAPE:
                                   # MRP is one global greedy over (lineup, contest) pairs, this fills
                                   # each contest's slice in descending-top-prize order.
  external_pool_own_scale: 30000.0  # prj_own: field size where 1 ownership pt == 1 proj pt
  external_pool_pwin_sharpness: 0.05 # p_win: exponent multiplier on an entry count (1.0 = literal P(win); calibrated lower, see models.py). With flat_reference below, the count is that fixed reference rather than each contest's implied entries
  external_pool_pwin_admit_n: 2000  # p_win stage-A cull window (flat -- see multiplier below). 100 (max(100,1.5x) scaled) was the prior default, validated on an 8-slate replay-harness sweep; SUPERSEDED 2026-07-31: a real-money 7-slate/21-draw backtest (tests/backtest.py) with exact payout tables + real fields found this wider flat-2000 window beats it at p=0.007-0.03 on 5/6 alternate arms -- do not revert without new empirical evidence (see memory project-flat2000-live-override-20260731)
  external_pool_pwin_admit_multiplier: 0.0  # 0 = flat admit_n (matches the 2026-07-27/07-28 era, before this field existed). 1.5 (max(floor,1.5x), guaranteeing the largest contest fills) was the prior default; superseded alongside admit_n above
  external_pool_pwin_field_size: 0  # p_win: simulated opponent field size (0 = auto via pwin_field_size)
  external_pool_pwin_flat_reference: 0.0  # p_win: >0 gives every contest one flat exponent (sharpness x this). 0 = per-contest scaling, the VALIDATED setting (flat costs ~1.75% $/entry and wrecks the chalk-to-small-fields gradient)
  external_pool_proj_top_own_cap_start_pct: 100.0  # proj_top only, field size >= 5,000: ownership-percentile cap, loose (threshold) end. 100 = off (default; unvalidated, see models.py)
  external_pool_proj_top_own_cap_end_pct: 100.0    # proj_top only: cap percentile, tight end (today's largest implied field size). 100 = off
  external_pool_proj_top_ceiling_tiers: false       # proj_top only: rank medium/large fields on sim p95/p99 instead of mean proj_score. VALIDATED (drop_max-positive), off by default -- do not combine with the ownership cap above (tested, hurts). See models.py
  external_pool_proj_top_medium_large_boundary: 15000.0  # proj_top ceiling tiers only: implied-field-size boundary between p95 (medium) and p99 (large) treatment
  external_pool_roi_floor_pct: 40.0
  external_pool_proj_score_pct: 0.0  # pool-wide: cull bottom N% by ceiling (SaberSim 99th). Honoured by every ev_type
  external_pool_ceiling_weight: 0.25
  external_pool_cash_anchor_fraction: 0.25
  # --- Det selector: rank-normalised terms + recalibrated sweep ---------
  # external_pool_rank_normalize makes EVn and DEn percentile ranks among the
  # remaining candidates instead of a max-normalised EV and a CLIPPED
  # distance. The clip was the problem: Dn's redundancy sum needs
  # k < 1/rbar^2 to stay above 0, so in a large multi-entry contest it
  # saturates and the diversity term stops ordering anything (measured on
  # 08/11 mini-MAX: term IQR exactly 0.0000 by pick 66 of 79).
  #
  # THIS CHANGES WHAT evw_base/evw_max MEAN, so they are recalibrated with
  # it. Under the old clip, a very low EVw was needed just to keep the
  # collapsing diversity term relevant deep into a fill; ranked, the term
  # has full spread at every EVw, so the sweep no longer needs an extreme
  # low end. 0.10 -> 0.30 puts risk 1 exactly on the backtested "rank10"
  # setting and keeps all five tiers inside the tested band (rank10 +0.223pp
  # top-1%, rank25 +0.043pp; both non-negative on both ladder rungs).
  # Deliberately NOT reaching the old 0.50-1.00 range: rank50/rank75
  # regressed top-0.1% (-0.070/-0.093pp) and cardinal EVw 0.50 was the worst
  # arm tested. Note risk 5 is no longer a pure-EV portfolio.
  #
  # Status: 10-slate backtest returned NO EVIDENCE at conventional
  # significance (all four rank arms beat baseline on top-1%, 3 of 4 with
  # positive LOSO minimums, but every bootstrap CI includes 0). Shipped on
  # the mechanism argument -- the clip is a defect, not a design -- with a
  # forward shadow comparison against the previous settings pending.
  external_pool_rank_normalize: true
  external_pool_self_play_round_n_sims: 2000     # self_play: sims per round-loop pick (see self_play._ROUND_N_SIMS_DEFAULT). Clamped to the actual simulated n_sims if higher
  external_pool_self_play_precise_n_sims: 20000  # self_play: sims for the post-round-loop precision-refinement pass. 0 disables refinement entirely
  external_pool_self_play_shortlist_size: 1000   # self_play: candidates re-scored per round after round 0's full pass (see self_play.py's SHORTLIST RESTRICTION note)
  external_pool_topn_field_pool_size: 25000  # topn_coverage: one-time-per-slate opponent field pool size (ContestSimulator.generate_field)
  external_pool_topn_rank: 10                # topn_coverage: literal rank a candidate must cross to "cover" a simulated world (top-10) -- floor of the effective per-contest bar, see below
  external_pool_topn_percentile_floor: 0.001 # topn_coverage: effective rank = max(topn_rank, ceil(this * field_size_g)) -- e.g. 0.001 makes a 17,000-entry field effectively top-17. 0 = off (pure flat topn_rank)
  external_pool_topn_field_samples: 3        # topn_coverage: K independent field-pool draws per contest (anti-overfitting to one field snapshot). 5 -> 3 on 2026-08-11: the variance decomposition (scripts/diagnose_topn_variance_decomposition.py) attributed ~95% of cross-seed portfolio variance to sim-world resampling and only ~36% to field draws, while field scoring is the dominant wall-clock cost and scales with K -- so K buys little and the freed time funds more sim worlds instead
  external_pool_topn_generated_pool_size: 0  # topn_coverage: extra candidates from the same generator the field pool uses, merged in after 9/10-overlap dedup. 0 = off (unvalidated, see models.py)
  external_pool_topn_generated_leverage_weight: 0.0  # topn_coverage: blend generated candidates' sampling ownership toward self-referential "optimal ownership" (leverage.py) instead of plain projected ownership. 0 = off (today's behavior, unvalidated as a generation bias -- see models.py)
  external_pool_topn_sims_min: 9214                     # topn_coverage sim-budget formula (ACTIVE default -- see models.py's calibration note). n_sims_g = clip(round(sims_min*(field_size/reference)^power), sims_min, n_sims). 4607 -> 9214 (2x) on 2026-08-11: selector stability is monotone in sim budget (scripts/sweep_topn_sim_budget.py)
  external_pool_topn_sims_reference_field_size: 392     # topn_coverage sim-budget formula reference field size
  external_pool_topn_sims_power: 0.222                  # topn_coverage sim-budget formula power. CALIBRATED 2026-08-09 against archived slate 07222026 (single slate -- see scripts/calibrate_topn_sims_per_contest.py)
  external_pool_topn_smooth_tau_scale: 0.0                # topn_coverage SMOOTHED EXCEEDANCE. 0 = the original hard `1[score >= threshold]` indicator. > 0 swaps it for P(threshold <= score) under the rank-N order statistic's own sampling distribution (sd = sqrt(N*(1-N/F)) * dScore/dRank), a Rao-Blackwellization that is unbiased for "crosses a freshly drawn field" with strictly lower variance -- aimed at the ~1.9-events-per-candidate / rho_full ~0.30 rare-event noise that caps every top-heavy objective here. 1.0 = the implied width. Pair with external_pool_topn_field_samples: 1. DEFAULT OFF pending walk-forward validation
  external_pool_corr_max_sims: 25000                     # caps the worlds the DIVERSITY term's pool correlation uses (evenly strided; 0 = all). Lets simulation.n_sims be raised for p_win -- which concentrates its weight on the few worlds where a candidate tops the field, split-half rho 0.880 at 12,500 worlds/stage vs 0.935 at 25,000 -- without precompute_pool (5.73 GB above baseline at M=5,139 x 50,000 worlds) dragging peak memory along. The diversity ordering is already settled at split-half rho_full 0.976-0.999, so extra worlds buy it nothing. NO-OP at the shipped n_sims=25,000
  external_pool_topn_sims_per_contest_fraction: 0.5  # topn_coverage: fallback flat fraction, used only if any of the three formula knobs above is 0
  # SaberSim grid calibration (see build_quantile_grids in external_pool.py).
  # Two independent corrections, deliberately not merged:
  #   zero_inflate  SHAPE — a DK hitter scores exactly 0 when he never reaches
  #                 base and drives nobody in. Measured 20.6% of rostered
  #                 batters across 10 archived slates vs 2.19% in the raw
  #                 grids. Per-batter probability from (1-OBP)^PA, mean-preserving.
  #   mean_calib    LOCATION — realized/grid mean 0.878 for batters (p=0.009);
  #                 pitchers 0.935 but p=0.30, so left at 1.0 rather than fit noise.
  # They only work together: zero-inflation alone makes the tail WORSE, because
  # holding the mean forces the surviving mass up ~22%. Both on moves lineup
  # mean PIT from 0.405 to 0.497 (calibrated = 0.500).
  #
  # SUPERSEDED 2026-07-31 (both flags below): the same 7-slate/21-draw
  # real-money backtest that widened admit_n found the pre-calibration
  # (uncalibrated) grids paired with the wide window outperform the
  # calibrated+narrow combination -- do not revert without new empirical
  # evidence (see memory project-flat2000-live-override-20260731). The
  # calibration fix above is still true on its own terms (better PIT); it
  # just isn't the currently winning combination with the wider window.
  external_pool_zero_inflate: false
  external_pool_scratch_prob: 0.0      # flat, projection-independent late-scratch rate
  external_pool_mean_calib_batter: 1.0
  external_pool_mean_calib_pitcher: 1.0

# ---------------------------------------------------------------------------
# Marginal-Reward Portfolio (MRP) -- parallel track, Haugh & Singal 2019.
# Deliberately NOT under gpp.*: this is a separate allocator that shares the
# sim/field/payout substrate but none of the funnel, and gpp.* is already at
# the edge of manageability. Read by the live pipeline since 2026-08-19
# (src/api/pipeline.py, the external_pool_ev_type == "marginal_reward" branch)
# as well as by scripts/eval_*; UI/models.py sync is done, so the three-way
# sync rule below applies.
# ---------------------------------------------------------------------------
marginal_reward:
  # Selected by gpp.external_pool_ev_type: marginal_reward. These are only the
  # tuning knobs -- the mode switch lives with every other mode switch.
  # The pool-wide ceiling floor is NOT one of them: MRP honours
  # gpp.external_pool_proj_score_pct like every other ev_type, culling the
  # bottom N% by SaberSim 99th before any scoring (it did not until
  # 2026-08-23, which is why an MRP portfolio could contain lineups the rest
  # of the funnel treats as unplayable).
  # Must stay in sync with src/api/models.py MarginalRewardConfig and
  # ui/src/types.ts MarginalRewardConfig (tests/test_mrp_config_sync.py).

  # Overlap governance. Two rules doing two different jobs -- see
  # src/optimization/mrp/allocator.py::AllocationRules.
  gamma_in: 7           # max shared players vs entries in the SAME contest.
                        # EV rule: the same-contest set is the only set our
                        # entries compete with. Haugh & Singal swept {5,6,7}
                        # of C=9 and found C-3 best; C=10 here, so 7.
  gamma_out: 8          # max shared players vs entries in ANY OTHER contest.
                        # NOT an EV rule -- separate contests never compete --
                        # so this is bankroll-variance control only. 8 is a
                        # no-op against a pool already through the 9/10 cull;
                        # the knob only bites at 7 or lower.
  allow_cross_contest_duplicates: false   # user decision. Under the paper's
                        # logic this costs EV (a lineup that is the best
                        # marginal addition in two separate contests has no
                        # competitive reason not to be played twice); it is
                        # kept as a risk choice, not an optimisation.

  # Estimator. 0.0 = the exact rank-lookup path. > 0 swaps in smoothed
  # exceedance at that width (1.0 = the derived width). Measured on dR:
  # tau 0.5 -> rho vs exact 0.988 / level ratio 1.045; tau 1.0 -> 0.966 /
  # 1.235. Default off, matching gpp.external_pool_topn_smooth_tau_scale:
  # the derivation justifies the width, only a walk-forward justifies
  # enabling it.
  smooth_tau_scale: 0.0

  # Opponent field pool, generated once per slate and subsampled per contest
  # to that contest's implied entrant count.
  field_pool_size: 25000
  # The global greedy compares across contests, so EVERY contest's state is
  # alive at once and the dominant (M x S) uint16 array multiplies by the
  # contest count. This caps the world axis (evenly strided) instead.
  max_sims_per_contest: 12500

  # --- Haugh & Singal line 2: mean-variance frontier generation ------------
  # Sweep `argmax_w w'mu + lambda(w'Sigma w - 2 w'sigma_dG)` and add the
  # results to the candidate pool. By equation (14) that lambda-term is
  # Var(w'delta - G) - Var(G), i.e. the variance of our MARGIN over the payout
  # cutoff -- so the sweep runs from the plain projection lineup out to the
  # highest-margin-variance one. dR cannot select what is not in the pool, and
  # the pool measured as NOT spanning this region on 9/9 slates (the coverage
  # arm of the 2026-08-19 gate; frontier minimum at pool percentile 0.000).
  # Solved with CP-SAT + McCormick product variables over within-copula-unit
  # pairs only (~1,000, vs ~80,000 dense) -- see src/optimization/mrp/
  # frontier_qp.py. Off by default: it costs solve time and changes the pool.
  frontier_enabled: false
  #
  # ONE EXACT ANCHOR PER LAMBDA, THEN FREE MUTATION. The obvious build --
  # iterate no-good cuts until N lineups come out, as generate_optimal_lineups
  # does -- measured at ~10s PER LINEUP: each cut makes the next solve harder
  # and every one re-proves optimality from scratch. But we do not need optimal
  # lineups. The paper needs argmax because it PLAYS w_lambda; dR re-ranks by
  # marginal dollars anyway, so that proof is bought and discarded. So one
  # anchor is solved per lambda and its neighbourhood is walked with
  # generate_shape_mutants (no solver), everything ranked by the exact
  # objective. Measured on 08/18: 520 lineups in 16.5s vs 90 in 15 minutes, at
  # BETTER quality (median 93-96% of each lambda's optimum).
  #
  # Wall clock is therefore driven by n_lambdas alone (~2.6s per anchor);
  # the other three knobs raise yield for ~1s total.
  frontier_n_lambdas: 12        # size of the lambda SEARCH grid that line 4
                                # chooses from -- not an operating point.
                                #
                                # LAMBDA IS NOW CHOSEN PER CONTEST, by the
                                # paper's Algorithm 4 line 4:
                                #   lambda* = argmax_lambda sum_d
                                #     (R_d - R_{d+1}) P{w'delta > G^(r_d)}
                                # evaluated against each contest's own
                                # simulated field and payout table. That step
                                # used to be SKIPPED, on the argument that dR
                                # re-ranks by marginal dollars anyway -- which
                                # governs selection from what we generate, and
                                # cannot fix a grid generating the wrong
                                # thing. In its place was an invented rule
                                # ("raise lambda until the top lineup moves N
                                # players") with no connection to the payout
                                # structure or the field size. Measured on
                                # 08/24, it put half the grid where the
                                # objective had gone projection-blind: rho
                                # with projection 0.377 at the grid's top and
                                # NEGATIVE just beyond, team spread collapsed
                                # to 3.4%, so a 97-projection stack scored
                                # 98.6% of a 105-projection one.
                                #
                                # Line 4 gives lambda* rising with field size
                                # -- ~0.037 at 496 entrants, ~0.056 at 8,000 --
                                # i.e. small contests get higher-projection,
                                # less contrarian builds. That matches the
                                # conventional read of small-field play, and
                                # falls out of the payout maths rather than
                                # being tuned to it.
  frontier_target_lineups: 8000 # TOTAL generated lineups to aim for. NOT a
                                # per-team rate: output is
                                # n_lambda_star x n_teams x per_team, and
                                # n_lambda_star is EMERGENT -- whatever line 4
                                # returns once it has seen the contests. A
                                # fixed per-team rate therefore swung the pool
                                # from 4,320 lineups (6 operating points) to
                                # 1,920 (2 operating points) on the SAME
                                # setting, purely on how much the slate's
                                # contests happened to agree. Dividing a total
                                # by the actual lambda* count instead keeps
                                # output near target and the memory projection
                                # stable enough to plan against.
  frontier_min_per_team: 4      # floor on the DERIVED per-team cap. That cap
                                # is the anti-monopoly guarantee -- without it
                                # the generator produced 100% ONE-TEAM lineups
                                # on 08/18, since every lambda's argmax picks
                                # the same team and generate_shape_mutants
                                # preserves the stack profile exactly -- so it
                                # has to survive the division on a slate with
                                # many operating points.
  frontier_sample_n: 30000      # candidates drawn from CandidateGenerator's
                                # team-round-robin sampler, then ranked by the
                                # exact objective. Measured on 08/18: 30k in
                                # 9.6s, scored in 0.03s, all 18 teams covered,
                                # each team's best recovering 93.7-99.1% of
                                # that team's EXACT stack-forced optimum.
                                # Stack-forcing the solver instead gets 100%
                                # but costs 6.9s per anchor -- 374s for
                                # 3 lambdas x 18 teams.
  frontier_n_anchors: 2         # exact CP-SAT solves at spread lambdas. Keeps
                                # the true frontier tip in the pool (sampling
                                # lands ~4% short) and stands as a drift check
                                # on the sampler. 0 = completely solver-free.
  frontier_n_generations: 2     # shape-mutation depth around the per-team
                                # winners. The per-team cap is RE-APPLIED after
                                # mutation: without that, 2 generations x 4
                                # mutants turned 1,728 picks into 32,893
                                # lineups and the per-contest (M x S) rank
                                # arrays blow the memory budget.
  frontier_mutants_per_parent: 4
  frontier_salary_floor: 47500   # min salary for GENERATED lineups. Set to the
                                # floor SaberSim was given: generated lineups
                                # are merged into the external pool and compete
                                # with it, so they should occupy the same
                                # salary regime. Deliberately NOT
                                # optimizer.salary_floor -- that is a holdover
                                # from the internal optimizer and is higher
                                # than what the external pool was built under.
                                # 0 disables, but with no floor the sampler
                                # leaves thousands unspent, a shape no other
                                # stage of the funnel produces (and unused
                                # salary is a dupe-model feature).
  frontier_solver_timeout_s: 8.0   # per-anchor cap; FEASIBLE is accepted. Only
                                # the highest lambda usually needs it: measured
                                # 5 of 6 anchors proved OPTIMAL in under 3.4s,
                                # and only the frontier's extreme end saturates.
  frontier_mutant_workers: 0    # processes the shape-mutation step is spread
                                # over. 0 = auto, 1 = serial. AUTO IS PHYSICAL
                                # CORES - 1, affinity aware: the loop is
                                # compute-bound Python, so an SMT sibling adds
                                # nothing. Measured on 8 cores / 16 threads,
                                # the big gen-2 call went 4.18x at 4 workers,
                                # 5.31x at 6, 5.87x at 8, 5.91x at 12 -- flat
                                # from the physical count on -- while the
                                # smaller gen-1 call got SLOWER past 6.
                                # PURE SPEED, not a pool decision: parents are
                                # chunked at a fixed size and each chunk draws
                                # from its own SeedSequence child, so the
                                # lineups are identical at any worker count.
                                # Worth having because mutation is the biggest
                                # block of the stage (21.8s of 39.7s measured
                                # on 08/25, which auto ran in 22.1s) and is
                                # a pure-Python per-parent loop -- threads
                                # cannot touch it, only processes can. The
                                # quality dial for the same time is
                                # frontier_n_generations x mutants_per_parent,
                                # which builds ~20x target_lineups so _cap can
                                # keep 1x.
  # Frontier lineups are EXEMPT from gpp.external_pool_proj_score_pct: the
  # floor basis is SaberSim's own "99th" column, which a generated lineup does
  # not have, and the fallback (compute_pool_ceiling_proxy) assumes the 10
  # rostered players are independent -- so it understates exactly the
  # correlated-stack variance this objective maximises. dR still has to want
  # them; the exemption only declines to pre-judge them on a biased basis.
  #
  # They are ALSO exempt from the 9/10 near-duplicate cull. Shape mutants
  # differ from their parent by one player, which is exactly what that cull
  # targets -- it removed 73% of them (520 -> 140) when tried -- and it is
  # redundant against dR, whose demotion term already prices a near-duplicate
  # mechanically. Exact duplicates are still dropped. NOTE the knock-on:
  # gamma_out: 8 is a no-op only against a fully 9/10-culled pool, so it can
  # start binding on frontier-vs-frontier pairs.

# NOTE: stochastic (Dirichlet) ownership and sigma_dG-targeted generation were
# BUILT AND THEN DESCOPED BY MEASUREMENT, so they have no config here:
#   * Perfect knowledge of the entire opponent field measured worth ~nothing
#     (median +$0.39/entry, +$0.13 drop-largest; on the rate ladder its top-1%
#     edge flips sign when one slate is removed, positive 2/9). Ownership
#     modelling is bounded above by that.
#   * sigma_dG measured rho +0.907 with ownership (16.1% of variance new), so
#     a "low-sigma frontier the pool lacks" is a low-OWNERSHIP frontier the
#     pool lacks -- already disconfirmed here.
# Both modules and their tests remain as measurement tools. See EVIDENCE_LOG.md
# 2026-08-19 entries before re-adding either knob.
